{% if messages %}
<div class="mb-4 space-y-2 notify-alert-group" role="alert">
  {% for message in messages %}
  <div class="notify-alert px-4 py-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800{% else %}bg-green-100 text-green-800{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
