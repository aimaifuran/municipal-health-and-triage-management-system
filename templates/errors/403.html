{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
  <h1 class="text-4xl font-bold text-red-600">403</h1>
  <p class="mt-2 text-lg text-slate-700">Unauthorized access detected.</p>
  <p class="text-slate-500 mt-1">You do not have permission to view this resource.</p>
  <a href="{% url 'dashboard:home' %}" class="mt-6 text-teal-600 hover:underline">Return to Dashboard</a>
</div>
{% endblock %}
