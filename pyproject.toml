[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv", "staticfiles"]
