services:
  - type: web
    name: mhtms-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mhtms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mhtms-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: mhtms-redis
          type: redis
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: redis
    name: mhtms-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: mhtms-db
    plan: free
    databaseName: mhtms
    user: mhtms
