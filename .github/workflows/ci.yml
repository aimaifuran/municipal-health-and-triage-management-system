name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mhtms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: mhtms_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
      - name: Lint
        run: |
          black --check .
          isort --check-only .
          flake8 . --max-line-length=100 --exclude=migrations,.venv,staticfiles
      - name: Security scan (Bandit)
        run: |
          bandit -r . -x ./tests,./.venv,./staticfiles -f json -o bandit-report.json --exit-zero
          bandit -r . -x ./tests,./.venv,./staticfiles --exit-zero
      - name: Dependency audit
        run: pip-audit -r requirements/base.txt
      - name: Django deploy check
        run: |
          python manage.py migrate --noinput
          DJANGO_SETTINGS_MODULE=config.settings.production python manage.py check --deploy
      - name: Run tests
        run: pytest
